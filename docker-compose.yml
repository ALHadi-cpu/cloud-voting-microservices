version: '3.8'

services:
  vote:
    build: ./vote
    ports:
      - "5000:5000"
    networks:
      - voting-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    networks:
      - voting-net

  worker:
    build: ./worker
    networks:
      - voting-net
    depends_on:
      - redis
      - db
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: votesdb

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: votesdb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - voting-net

  result:
    build: ./result
    ports:
      - "3000:3000"
    networks:
      - voting-net
    depends_on:
      - db
    environment:
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: votesdb

networks:
  voting-net:
    driver: bridge

volumes:
  db-data:
